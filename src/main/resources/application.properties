# =========================================================
# ServiceHub API - Configuracoes padrao (perfil de demonstracao)
# Usa H2 em memoria para que o projeto rode localmente SEM
# necessidade de instalar/configurar PostgreSQL ou Docker.
# Para rodar com PostgreSQL, ative o perfil "postgres"
# (veja application-postgres.properties e o README.md).
# =========================================================

spring.application.name=servicehub-api
server.port=8080

# ---- Banco de dados H2 (em memoria) ----
spring.datasource.url=jdbc:h2:mem:servicehub;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2: SOMENTE neste perfil de demonstracao (protegido/desligado no perfil postgres)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
# create-drop: cria o schema ao iniciar e apaga ao encerrar. Ideal para
# demonstracao/desenvolvimento local com H2 (sem Flyway).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Flyway desativado no perfil padrao (H2 nao usa migrations) ----
spring.flyway.enabled=false

# ---- Seguranca / JWT ----
# ATENCAO: segredo de DESENVOLVIMENTO. Em producao use a variavel JWT_SECRET (perfil postgres).
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
# access token: 24h | refresh token: 7 dias (em milissegundos)
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Administrador inicial (demo). Troque a senha / use variaveis de ambiente fora do ambiente local.
servicehub.admin.email=${ADMIN_EMAIL:admin@servicehub.com}
servicehub.admin.password=${ADMIN_PASSWORD:Admin@123}

# CORS: origens permitidas (separadas por virgula). Nunca "*" com credenciais.
servicehub.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---- Erros: nunca expor stack trace / mensagens internas ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---- Limites de consumo (OWASP API4) ----
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=2MB

# ---- GraphQL (endpoint alternativo: POST /graphql) ----
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# ---- Actuator: apenas health ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- Logging ----
logging.level.com.servicehub=DEBUG

# ---- Swagger / SpringDoc ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
