# =========================================================
# ServiceHub API - Perfil PostgreSQL (producao/homologacao)
# Ative com: --spring.profiles.active=postgres
# Requer um PostgreSQL rodando (veja docker-compose.yml)
# =========================================================

spring.application.name=servicehub-api
server.port=8080

# ---- DataSource PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/servicehub
spring.datasource.username=servicehub
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# validate: o schema e' controlado exclusivamente pelo Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Logging ----
logging.level.com.servicehub=DEBUG

# ---- Swagger / SpringDoc ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
