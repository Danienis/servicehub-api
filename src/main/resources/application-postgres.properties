# =========================================================
# ServiceHub API - Perfil PostgreSQL (producao/homologacao)
# Ative com: --spring.profiles.active=postgres
# Requer um PostgreSQL rodando (veja docker-compose.yml).
# Todas as credenciais vem de variaveis de ambiente (.env) - nada de segredo no codigo.
# =========================================================

spring.application.name=servicehub-api
server.port=8080

# ---- DataSource PostgreSQL ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:servicehub}
spring.datasource.username=${DB_USER:servicehub}
spring.datasource.password=${DB_PASS:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# validate: o schema e' controlado exclusivamente pelo Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Flyway ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---- Seguranca / JWT ----
# OBRIGATORIO: sem default (a aplicacao nao sobe sem JWT_SECRET). Gere com: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Administrador inicial: so e' criado se ADMIN_EMAIL e ADMIN_PASSWORD forem informados
servicehub.admin.email=${ADMIN_EMAIL:}
servicehub.admin.password=${ADMIN_PASSWORD:}

servicehub.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---- Ferramentas de desenvolvimento DESLIGADAS fora do ambiente local ----
spring.h2.console.enabled=false
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:false}

# ---- Logging ----
logging.level.com.servicehub=${LOG_LEVEL:INFO}
