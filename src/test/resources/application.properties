# Configuracao dos testes: H2 em memoria, sem Flyway, sem seed, segredo JWT de teste.
spring.application.name=servicehub-api-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

jwt.secret=test-secret-test-secret-test-secret-test-secret
jwt.expiration=86400000
jwt.refresh-expiration=604800000

servicehub.admin.email=
servicehub.admin.password=
servicehub.cors.allowed-origins=http://localhost:3000

server.error.include-stacktrace=never
spring.data.web.pageable.max-page-size=50
spring.graphql.graphiql.enabled=false
management.endpoints.web.exposure.include=health
